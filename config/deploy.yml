# Kamal 2 deploy for live. See DEPLOY.md. The server is reached through the Cloudflare Tunnel as the SSH alias "hosting".
service: live
image: live

servers:
  web:
    hosts:
      - hosting
    # The signalling port is not behind kamal-proxy: the tunnel reaches it by this name on the Kamal network.
    # Media does not pass through the tunnel: browsers reach one UDP port on the server's own address.
    # The port alternates between 40000 and 40001 from one deploy to the next (deploy/server.sh picks it),
    # so the new container starts while the old one still holds its calls.
    options:
      network-alias: live-signal
      publish: "<%= ENV.fetch("LIVE_MEDIA_PORT", "40000") %>:<%= ENV.fetch("LIVE_MEDIA_PORT", "40000") %>/udp"

# A newer client is laid over the one in the image from this directory of the server, so the page can change without restarting calls.
# And the rooms of a server that is stopping are handed to the one taking over through /state.
volumes:
  - /srv/live/web:/web-live:ro
  - /srv/live/state:/state

ssh:
  user: root

# What the proxy answers while the app is not there, such as the seconds of a deploy: our own pages, which try again by themselves.
error_pages_path: deploy/errors

# Kamal's local registry: the image is pushed through an SSH tunnel, no Docker Hub.
registry:
  server: localhost:5555

builder:
  arch: amd64

proxy:
  host: live.versatile.sh
  app_port: 3000
  healthcheck:
    path: /up
  # The proxy listens on the VPS loopback only: the public path is the Cloudflare Tunnel, which also ends TLS.
  run:
    bind_ips:
      - 127.0.0.1

# The container's `service` label is how the server's collector knows whose log it is.
logging:
  driver: json-file
  options:
    max-size: 10m
    labels: service

env:
  clear:
    PORT: "3000"
    SIGNAL_PORT: "3001"
    PUBLIC_ORIGIN: https://live.versatile.sh
    COUNTRY_HEADER: CF-IPCountry
    ADDRESS_HEADER: CF-Connecting-IP
    MEDIA_UDP_PORT: "<%= ENV.fetch("LIVE_MEDIA_PORT", "40000") %>"
    HANDOVER_DIR: /state
    MEDIA_PUBLIC_IP: 217.76.62.157
    WEB_LIVE_DIR: /web-live
    GITHUB_REPO: versatile-sh/meeting-platform
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4318
    CF_ACCESS_TEAM_DOMAIN: versatile-sh.cloudflareaccess.com
    # Public host: Access lets everyone through, so there is no audience to check.
  # Kamal refuses an empty secret: list one here only once its 1Password field is filled and .kamal/secrets extracts it.
  # secret:
  #   - MY_SECRET
