# Dependabot opens one pull request per ecosystem per week, with every update of that ecosystem in it.
# Security fixes come on their own, as soon as they exist ("Dependabot security updates" is on for this repository).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # A release must be a week old before it is proposed: most poisoned packages are pulled within days.
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  # Actions are pinned to a commit; Dependabot moves the commit and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The base images of the Dockerfile, tag and digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
