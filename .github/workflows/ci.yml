name: ci
# Actions are pinned to a commit, with the tag it had as a comment: a tag can be moved to other code.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Known vulnerabilities in what the code calls
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Module checksums match go.sum
        run: go mod verify
      - name: Software bill of materials
        run: go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 app -json -licenses -main cmd/live -output ../sbom-server.cdx.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-server
          path: sbom-server.cdx.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exactly what the lock file says, running no package script
        run: npm ci --ignore-scripts
      - name: Registry signatures and provenance of every package
        run: npm audit signatures
      - name: Known vulnerabilities, development packages included
        run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Software bill of materials of what ships to the browser
        run: npm sbom --sbom-format cyclonedx --omit dev > ../sbom-web.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: sbom-web.cdx.json

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t live .
      - name: The image starts and answers /up
        run: |
          docker run -d --name live -p 3000:3000 live
          for i in $(seq 1 20); do curl -fsS localhost:3000/up && exit 0; sleep 1; done
          docker logs live; exit 1
