# Code generated by vlint golangci from github.com/versatile-sh/go-lint. DO NOT EDIT.
# Add repository rules to lint/golangci.local.yml and regenerate.
version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errorlint
    - errname
    - nilerr
    - nilnil
    - containedctx
    - contextcheck
    - noctx
    - fatcontext
    - revive
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - sloglint
    - forbidigo
    - depguard
    - gochecknoinits
    - godoclint
    - misspell
    - unconvert
    - nolintlint
    - thelper
    - usetesting
    - tparallel
    - testifylint
    - gosec
    - gomoddirectives
  settings:
    staticcheck:
      checks: ["all", "-QF*", "-ST1000", "-ST1020", "-ST1021", "-ST1022"]
    errcheck:
      exclude-functions: [fmt.Fprint, fmt.Fprintf, fmt.Fprintln]
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    nilnil:
      checked-types: [ptr, func, chan, uintptr, unsafeptr]
    revive:
      rules:
        - name: context-as-argument
        - name: receiver-naming
        - name: var-naming
    sloglint:
      no-global: all
      context: scope
      static-msg: true
      key-naming-case: snake
      no-mixed-args: true
      forbidden-keys: [err]
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^fmt\.Print.*$'
          msg: write through an injected writer or logger
        - pattern: '^context\.(Background|TODO)$'
          msg: inherit the caller context
    godoclint:
      default: none
      enable: [start-with-name, require-pkg-doc, single-pkg-doc, deprecated]
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      severity: medium
      confidence: medium
      excludes: [G104]
    depguard:
      rules:
        no-mocks:
          files: ["**/*_test.go"]
          deny:
            - pkg: github.com/golang/mock
              desc: write a hand fake
            - pkg: go.uber.org/mock
              desc: write a hand fake
            - pkg: github.com/stretchr/testify/mock
              desc: write a hand fake
        one-logger:
          files: ["!**/cmd/**"]
          deny:
            - pkg: log$
              desc: use log/slog
            - pkg: go.uber.org/zap
              desc: use log/slog
            - pkg: github.com/sirupsen/logrus
              desc: use log/slog
            - pkg: github.com/rs/zerolog
              desc: use log/slog
  exclusions:
    generated: strict
    presets: [std-error-handling]
    rules:
      - path: '(^|/)(app|cmd)/'
        linters: [forbidigo]
      - path: '(^|/)main\.go$'
        linters: [forbidigo]
      - path: '_test\.go'
        linters: [forbidigo, gosec, errcheck, noctx, bodyclose, godoclint]
      # Temporary, each rule is removed by the fix pull request of its class.
      - path: '^audit/query\.go$|^handoff/dir\.go$|^core/room/room\.go$'
        linters: [gosec]
      - path: '^guestpass/guestpass_test\.go$|^sfu/engine\.go$|^core/room/room_test\.go$'
        linters: [staticcheck]
formatters:
  enable: [gofmt, goimports]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
