exclusions:
  rules:
    # These open files the server itself names inside the directory the operator configures (AUDIT_DIR, HANDOVER_DIR).
    - path: '^(audit/query|handoff/dir)\.go$'
      linters: [gosec]
      text: 'G304'
    # A seat index is TrailingZeros64 of a 64-bit bitmap with a free bit, so it is 0 to 63 and fits a uint8.
    - path: '^core/room/room\.go$'
      linters: [gosec]
      text: 'G115'
    # Moving to SetICEAddressRewriteRules changes the published media candidates; it needs a call test on a public host first.
    - path: '^sfu/engine\.go$'
      linters: [staticcheck]
      text: 'SA1019'
